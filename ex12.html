<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desk 任意アプリインストール / WebView</title>
    
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: "Noto Sans JP Local";
            src: local("Noto Sans JP");
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: "Noto Sans JP Local", "Noto Sans JP", sans-serif;
        }

        .main {
            padding: 85px 15px 15px 15px;
        }

        .main .bar {
            width: 100%;
            height: 70px;
            padding: 0px 15px;
            display: flex;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            font-size: 16px;
            background-color: #ffffff;
            border-bottom: 1px solid #c2c2c2;
        }

        .main .bar .title {
            font-size: 16px;
            margin-bottom: 0;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main .button {
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            border: none;
            font-weight: bold;
            background-color: #eaeaea;
        }

        .main .button:disabled {
            cursor: default;
            opacity: 0.8;
        }

        .main .button:active {
            background-color: #c5c5c5;
        }

        .main .button:disabled:active {
            background-color: #eaeaea;
        }

        .spacer {
            margin: 10px 0px;
        }
    </style>
    <script>
        function openV2WebView() {
        }
        window.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(document.location.search);
            
            const openV2WebView = document.getElementById("openV2WebView");
            const openAndroidSecuritySettings = document.getElementById("openAndroidSecuritySettings");
            const openDocumentsUI = document.getElementById("openDocumentsUI");
            
            if (params.get("from") == "v1WebView") {
                openV2WebView.disabled = true;
                document.getElementById("title").innerText = "Desk 任意アプリインストール / v2 WebView";
            } else {
                openAndroidSecuritySettings.disabled = true;
                openDocumentsUI.disabled = true;
            }

            openV2WebView.addEventListener("click", () => {
                location.href = "intent://webview#Intent;scheme=clova;package=ai.clova.display.app;S.url=http%3A%2F%2F192.168.1.13%3A8080%2Fex12.html%3Ffrom%3Dv1WebView;end";
            });

            openAndroidSecuritySettings.addEventListener("click", () => {
                location.href = "intent:#Intent;action=android.settings.SECURITY_SETTINGS;end";
            });

            openDocumentsUI.addEventListener("click", () => {
                location.href = "intent://com.android.providers.documents/a#Intent;scheme=content;component=com.android.documentsui/.FilesActivity;B.android.content.extra.SHOW_ADVANCED=true;B.android.content.extra.SHOW_FILESIZE=true;B.android.content.extra.FANCY=true;B.com.android.documentsui.PRODUCTIVITY=true;end";
            });
        });
    </script>
</head>
<body>
    <div class="main">
        <div class="bar" id="fakeTitle">
            <span class="title" id="title">Desk 任意アプリインストール / v1 WebView</span>
        </div>
        <div class="center">
            <button class="button" id="openV2WebView">
                v2 WebViewを開く
            </button>
            <div class="spacer"></div>
            <button class="button" id="openAndroidSecuritySettings">
                提供元不明のアプリを許可
            </button>
            <button class="button" id="openDocumentsUI">
                DocumentsUIを開く
            </button>
            <div class="spacer"></div>
            <button class="button" onclick="location.reload();">
                ページの再読み込み
            </button>
        </div>
    </div>
</body>
</html>
